gate: modern-enterprise-architecture-audit-export-gate
version: V2.23
owner: governance-team
generatedOn: 2026-06-02
command:
  local: make check-modern-architecture-audit-export
  preflight: make check-modern-architecture-kit
  export: make export-modern-architecture-audit
qualityGate:
  requiredInMakeTest: true
  zeroDependency: true
  blocksOnMismatch: true
outputs:
  - path: build/modern-enterprise-architecture-audit/audit-export.json
    type: json
    required: true
    invariant: version, pair count, control count, evidence and artifact list match source manifests
  - path: build/modern-enterprise-architecture-audit/audit-export.md
    type: markdown
    required: true
    invariant: human-readable report is generated from the same packet
  - path: build/modern-enterprise-architecture-audit/oscal-summary.json
    type: json
    required: true
    invariant: OSCAL summary control count, profile version, POA&M state and risk register match source evidence
  - path: build/modern-enterprise-architecture-audit/audit-export-integrity.json
    type: json
    required: true
    invariant: generated output digests match the exported audit files
  - path: build/modern-enterprise-architecture-audit/audit-export-provenance.json
    type: json
    required: true
    invariant: provenance subject digests, build definition and source dependencies match exported audit files
  - path: build/modern-enterprise-architecture-audit/audit-export-signing-policy.json
    type: json
    required: true
    invariant: signing policy payload digest matches the provenance statement and requires external signature
expectations:
  architectureVersion: V2.23
  starterKitPairs: 54
  controlCount: 38
  verificationCommand: make check-modern-architecture-kit
  verificationResult: pass
  oscalControlCountMatchesCatalog: true
  poamRequiredFollowsOpenFindings: true
  integrityManifestRequired: true
  generatedOutputDigestsMatch: true
  provenanceStatementRequired: true
  provenanceSubjectDigestsMatch: true
  signingPolicyRequired: true
  signingPayloadDigestMatches: true
  signatureReceiptRequired: true
  signatureReceiptExternal: true
  poamRecordRequired: true
  poamMatchesAssessment: true
  riskRegisterRequired: true
  riskRegisterLinksPoam: true
  architectureDecisionRecordRequired: true
ciIntegration:
  localGate: make test
  makefileTarget: check-modern-architecture-audit-export
  script: scripts/check-modern-architecture-audit-export.py
retention:
  period: 2y
  reviewOn: 2026-12-02
