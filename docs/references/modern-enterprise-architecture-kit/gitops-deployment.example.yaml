deployment: order-command-service
environment: prod
domain: order
service: order-command-service
namespace: order-prod
image:
  repository: registry.company.com/order/order-command-service
  digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
replicas: 3
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
strategy:
  type: canary
  maxUnavailable: "0"
serviceAccount: order-command-service
security:
  podSecurity: restricted
  networkPolicy: infra/kubernetes/policies/order-command-service-network-policy.yaml
  imageVerificationPolicy: governance/supply-chain/prod-admission.rego
scaling:
  hpa: true
  minReplicas: 3
  maxReplicas: 12
  metric: cpu-70-percent
availability:
  podDisruptionBudget: minAvailable=2
  multiZone: true
configRefs:
  configMaps:
    - order-command-service-config
  secrets:
    - order-command-service-secrets
policy:
  requiresSignedImage: true
  requiresProvenance: true
  requiresSbom: true
