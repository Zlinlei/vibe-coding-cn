contract: customer-service-agent-genai-observability
aiProduct: customer-service-agent
owner: team-support-ai
provider: model-gateway
model:
  gatewayRoute: support-safe-default
  approvedModel: vendor-support-model
  modelVersion: "2026-05"
telemetry:
  semanticConvention: opentelemetry-genai
  traceEnabled: true
  tokenMetrics: true
  costMetrics: true
  toolCallSpans: true
  ragSpans: true
trace:
  sampleRate: 1
  requiredAttributes:
    - gen_ai.system
    - gen_ai.request.model
    - gen_ai.response.model
    - gen_ai.usage.input_tokens
    - gen_ai.usage.output_tokens
    - ai.prompt.version
    - ai.rag.index
metrics:
  latency: gen_ai.client.operation.duration
  tokenUsage: gen_ai.client.token.usage
  toolErrors: ai.tool.error.count
  groundedAnswerRate: ai.grounded_answer.rate
  cost: ai.cost.usd
logs:
  promptLogging: redacted
  responseLogging: redacted
  toolPayloadLogging: redacted
retention:
  traceDays: 180
  logDays: 30
privacy:
  piiRedaction: true
  trainingOptOut: true
  auditEvidence: governance/evidence/ai-observability/customer-service-agent-2026-q2.md
